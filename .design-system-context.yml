# デザインシステムの前提（figma-component-review skill の Phase 0 が読む）
#
# skill はこのファイルが無いと同じ5問を毎回聞く。値は判定に実際に効く:
#   ssot: both      → 「どちらを正とするか決める」を最優先の指摘として追加
#   phase: launch   → 破壊的変更を伴う指摘を「意図的な妥協」へ降格
#   phase: mature   → 同じ指摘を「移行計画」へ昇格
#   i18n: true      → 幅・オーバーフローの指摘を昇格（英語は日本語の1.5〜2倍）
#   dark_mode: true → ハードコード色の指摘を昇格
#
# 観測日: 2026-09-08 / 実測にもとづく。推測で埋めないこと。

phase: growth
strategy: scratch        # Tailwind + 自前 variant map（lib/figma-button-variants.ts）。MUI 等の汎用ライブラリは不使用
generic_level: 2         # 同一プロダクト内でドメインをまたいで使えるレベルを「汎用」と呼ぶ
ssot: figma              # CLAUDE.md §5 が Figma を Design Source of Truth と宣言している
split_approach: flat     # components/ は階層なし24件。30件が階層化の検討目安
naming_grammar: ""       # 未定。語順ルール（[カテゴリ]/[コンポーネント]/[バリアント]/[状態] 等）は未合意
figma_only_prefix: "_"   # Figma 専用プロパティの接頭辞規約
i18n: false              # i18n / locale / messages のいずれも存在しない
dark_mode: true          # app/globals.css に prefers-color-scheme: dark のブロックがある
platforms: [web]

# 既知の意図的な妥協。「やらない」ではなく「理由と再検討トリガーを残して着手しない」もの。
# トリガーの無い先送りは風化して既成事実になるため、必ず trigger を書く。
#
#   - item: ""      何を妥協しているか
#     why: ""       なぜ今それでよいか
#     trigger: ""   何が起きたら着手するか
intentional_compromises:
  - item: >-
      標準の境界線が2色に分裂している。トークン --color-border は #3A3A3A だが、
      クラスに直書きされた border-[#424242] が 61 箇所残っている
      (2026-09-08 計測。すべて app/admin: AdminLayout 35 / FlowchartEditor 17 / WorkEditor 9)。
      数え直すときは .ts も含めること:
      grep -rnoi 'border-\[#424242\]' --include='*.ts' --include='*.tsx' . を使う。
      減った経緯は git log と docs/requests/20260908-*.md を見る (ここには書かない)。
    why: >-
      Library の Border/Default が #3A3A3A であることは実値で確認済み (2026-09-08、
      Master ノード 502:1344 を選択して get_variable_defs で取得) で、CLAUDE.md §5 は
      Library を正と定めている。したがってトークン側が正しく、直書き側が旧値の残骸。
      ただし Master には Library に無い Border/Default #424242 がローカルスタイルとして
      現存しており (docs/requests/20260908-styleguide-figma-sync.md 付録B、Figma 側の
      付け替えはユーザー作業で未完了)、Figma 上でも 2 値が併存している。これが
      この妥協を風化させる最大の要因。
      置換そのものはハードコード色のトークン化と同一の作業で、完全一致の機械判定で
      一括処理するほうが漏れも過剰置換も出にくい。
      色差は 8bit グレー値で 58 (#3A3A3A) 対 66 (#424242)、WCAG コントラスト比 1.13:1。
      /styleguide の Components 節では両者が隣接する
      (StyleguideLayout.tsx の Card() の枠が border-border-light = #424242、
      その内側の FigmaOnlyPreview の破線枠が border-border = #3A3A3A)。2026-09-08 に実プレビューで目視し、計測値どおり
      差は小さいことを確認したが、知覚の程度は主観であり合否判定には使わない。
    trigger: >-
      解消の判定は border-[#424242] の残数がゼロになったとき。
      残る 61 件はすべて app/admin (認証の内側)。
      次に app/admin のトークン化を行うときに再計測し、ゼロになったらこの項目を削除する。
      なお解消時の置換先は border-border (#3A3A3A) ではなく border-border-light
      (#424242) が値を保つ選択肢である点に注意。#3A3A3A へ寄せるなら見た目が変わるので
      別途承認が要る。
      あわせて Figma Master 側の Border/Default #424242 の付け替えが済んだかも確認する。

  - item: >-
      radius がトークン化されていない。実装は rounded-[Npx] の直書きが 177 箇所あり、
      内訳は 8px 81 / 12px 34 / 6px 24 / 14px 12 / 10px 10 / 7px 4 / 2px 4 / 16px 3 /
      999px 2 / 24px 2 / 36px 1 / 32px 1 (2026-09-08 計測)。
      Figma の Radius コレクションは 2 / 4 / 8 / 16 / 40 / 80 の 6 値しかなく、
      12 / 14 / 6 / 10 / 7 / 24 / 32 / 36 に対応する変数が存在しない。
      トークン (rounded-r8 等) を使っている箇所は 2 箇所のみ。
      数え直すコマンド:
      grep -rnoE 'rounded-\[[^]]+\]' --include='*.tsx' components app src | sed 's/.*rounded/rounded/' | sort | uniq -c
    why: >-
      Figma 側も未トークン化であることを実値で確認した (VERIFIED 2026-09-08)。
      Master の Card (node 494:1363) を get_design_context で取得したところ
      rounded-[14px] の直書きで、Radius コレクションの変数にバインドされていない。
      同じく Tag は rounded-[16777200px] (= full)。
      したがって実装側だけをトークンへ寄せても「Library が正」(CLAUDE.md §5) の状態には
      ならず、Figma 側に 12 / 14 等を追加してもらうのが先。
      実装を最寄りのトークン (12→8 or 16 等) へ丸める案は、Figma の実デザイン (14px) と
      ずれるため採らない。
    trigger: >-
      Figma の Radius コレクションに 12 / 14 (および必要なら 6 / 10 / 24 / 32 / 36) が
      追加されたとき。追加されたら lib/design-tokens.ts の radius と
      app/globals.css の --radius-r* を同期し、rounded-[Npx] の直書きを
      rounded-r12 等へ一括置換する。
      Figma 側の追加依頼は docs/requests/20260908-figma-master-sync.md §6 に列挙してある。
