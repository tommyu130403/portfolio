# デザインシステムの前提（figma-component-review skill の Phase 0 が読む）
#
# skill はこのファイルが無いと同じ5問を毎回聞く。値は判定に実際に効く:
#   ssot: both      → 「どちらを正とするか決める」を最優先の指摘として追加
#   phase: launch   → 破壊的変更を伴う指摘を「意図的な妥協」へ降格
#   phase: mature   → 同じ指摘を「移行計画」へ昇格
#   i18n: true      → 幅・オーバーフローの指摘を昇格（英語は日本語の1.5〜2倍）
#   dark_mode: true → ハードコード色の指摘を昇格
#
# 観測日: 2026-09-08 / 実測にもとづく。推測で埋めないこと。

phase: growth
strategy: scratch        # Tailwind + 自前 variant map（lib/figma-button-variants.ts）。MUI 等の汎用ライブラリは不使用
generic_level: 2         # 同一プロダクト内でドメインをまたいで使えるレベルを「汎用」と呼ぶ
ssot: figma              # CLAUDE.md §5 が Figma を Design Source of Truth と宣言している
split_approach: flat     # components/ は階層なし24件。30件が階層化の検討目安
naming_grammar: ""       # 未定。語順ルール（[カテゴリ]/[コンポーネント]/[バリアント]/[状態] 等）は未合意
figma_only_prefix: "_"   # Figma 専用プロパティの接頭辞規約
i18n: false              # i18n / locale / messages のいずれも存在しない
dark_mode: true          # app/globals.css に prefers-color-scheme: dark のブロックがある
platforms: [web]

# 既知の意図的な妥協。「やらない」ではなく「理由と再検討トリガーを残して着手しない」もの。
# トリガーの無い先送りは風化して既成事実になるため、必ず trigger を書く。
#
#   - item: ""      何を妥協しているか
#     why: ""       なぜ今それでよいか
#     trigger: ""   何が起きたら着手するか
intentional_compromises:
  - item: >-
      標準の境界線が2色に分裂している。トークン --color-border は #3A3A3A だが、
      クラスに直書きされた border-[#424242] が 102 箇所残っている
      (app/admin 61 / components 26 / app/styleguide 14 / lib 1)。
      lib の 1 件は lib/figma-button-variants.ts:39 の Button/Function on バリアント。
      .ts にあるため .tsx だけを見る grep では拾えない。数え直すときは
      grep -rno 'border-\[#424242\]' --include='*.ts' --include='*.tsx' . を使う。
    why: >-
      Library の Border/Default が #3A3A3A であることは実値で確認済み (2026-09-08、
      Master ノード 502:1344 を選択して get_variable_defs で取得) で、CLAUDE.md §5 は
      Library を正と定めている。したがってトークン側が正しく、直書き側が旧値の残骸。
      ただし Master には Library に無い Border/Default #424242 がローカルスタイルとして
      現存しており (docs/requests/20260908-styleguide-figma-sync.md 付録B、Figma 側の
      付け替えはユーザー作業で未完了)、Figma 上でも 2 値が併存している。これが
      この妥協を風化させる最大の要因。
      置換そのものはハードコード色のトークン化と同一の作業で、完全一致の機械判定で
      一括処理するほうが漏れも過剰置換も出にくい。
      色差は 8bit グレー値で 58 (#3A3A3A) 対 66 (#424242)、WCAG コントラスト比 1.13:1。
      /styleguide の Components 節では両者が隣接する
      (StyleguideLayout.tsx:187 のカード枠が #424242、その内側の FigmaOnlyPreview の
      破線枠が border-border)。2026-09-08 に実プレビューで目視し、計測値どおり
      差は小さいことを確認したが、知覚の程度は主観であり合否判定には使わない。
    trigger: >-
      解消の判定は「B に着手したとき」ではなく border-[#424242] の残数がゼロになったとき。
      B (docs/requests/20260908-pr78-review-and-tokenize.md) は app/styleguide の 14 件を
      置換禁止、app/admin の 61 件を範囲外としているため、B が完了してもこの分裂は
      102 件中 26 件しか解消しない。B の完了時に必ず残数を再計測し、残っていれば
      この項目を残数を更新したうえで維持する。
      あわせて Figma Master 側の Border/Default #424242 の付け替えが済んだかも確認する。
